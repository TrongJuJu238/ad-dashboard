<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Helpdesk — Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="dashboard-body">

    <!-- Custom Title Bar -->
    <div class="title-bar">
        <div class="title-bar-drag">
            <span class="title-bar-text"><i class="fas fa-shield-alt"></i> IT Helpdesk</span>
        </div>
        <div class="title-bar-controls">
            <button class="title-btn" id="btnMinimize"><i class="fas fa-minus"></i></button>
            <button class="title-btn" id="btnMaximize"><i class="fas fa-square"></i></button>
            <button class="title-btn close" id="btnClose"><i class="fas fa-times"></i></button>
        </div>
    </div>

    <div class="layout">
        <!-- ========== SIDEBAR ========== -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-logo">
                <div class="sidebar-logo-icon">
                    <i class="fas fa-shield-alt"></i>
                </div>
                <span class="sidebar-logo-text">AD Helpdesk</span>
            </div>

            <!-- User Profile -->
            <div class="sidebar-user">
                <div class="sidebar-user-avatar" id="userAvatar">--</div>
                <div class="sidebar-user-info">
                    <div class="sidebar-user-name" id="userName">Loading...</div>
                    <div class="sidebar-user-role" id="userRole">IT Support</div>
                </div>
            </div>

            <!-- Navigation Menu -->
            <nav class="menu" id="sidebarMenu">
                <div class="menu-section">Management</div>
                <a class="menu-item active" data-tab="users" href="#">
                    <i class="fas fa-user-shield"></i>
                    <span>Users</span>
                </a>
                <a class="menu-item" data-tab="computers" href="#">
                    <i class="fas fa-desktop"></i>
                    <span>Computers</span>
                </a>

                <div class="menu-section">Operations</div>
                <a class="menu-item" data-tab="tasks" href="#">
                    <i class="fas fa-list-check"></i>
                    <span>Tasks</span>
                    <span class="badge-count" id="taskBadge" style="display:none">0</span>
                </a>
                <a class="menu-item" data-tab="calendar" href="#">
                    <i class="fas fa-calendar-alt"></i>
                    <span>Calendar</span>
                </a>

                <div class="menu-section">System</div>
                <a class="menu-item" data-tab="logs" href="#">
                    <i class="fas fa-history"></i>
                    <span>Audit Logs</span>
                </a>
                <a class="menu-item" data-tab="settings" href="#">
                    <i class="fas fa-cog"></i>
                    <span>Settings</span>
                </a>
            </nav>
        </aside>

        <!-- ========== MAIN CONTENT ========== -->
        <div class="main-content">
            <!-- Top Navigation -->
            <header class="top-nav">
                <div class="search-bar">
                    <i class="fas fa-search"></i>
                    <input type="text" id="globalSearch" placeholder="Tìm kiếm user, computer..." 
                           autocomplete="off">
                </div>
                <div class="top-nav-actions">
                    <button class="top-nav-btn" title="Refresh" onclick="refreshCurrentTab()">
                        <i class="fas fa-sync-alt"></i>
                    </button>
                    <button class="top-nav-btn" title="Notifications">
                        <i class="fas fa-bell"></i>
                    </button>
                </div>
            </header>

            <!-- Dashboard Header (dynamic) -->
            <div class="dashboard-header" id="dashboardHeader">
                <h1>User Management</h1>
                <p>Quản lý Active Directory Users hiệu quả.</p>
            </div>

            <!-- Content Area -->
            <div class="content-area" id="contentArea">
                <!-- Content injected by JS based on active tab -->
            </div>
        </div>
    </div>

    <!-- ========== MODALS ========== -->

    <!-- Group Modal -->
    <div class="modal-overlay" id="groupModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fas fa-layer-group" style="color: var(--primary); margin-right: 8px;"></i>User Groups</h3>
                <button class="modal-close" onclick="closeModal('groupModal')"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body" id="groupList">
                <!-- Group list injected -->
            </div>
        </div>
    </div>

    <!-- Compare Modal -->
    <div class="modal-overlay" id="compareModal">
        <div class="modal-content" style="width: 600px;">
            <div class="modal-header">
                <h3><i class="fas fa-code-compare" style="color: var(--accent-purple); margin-right: 8px;"></i>Compare Groups</h3>
                <button class="modal-close" onclick="closeModal('compareModal')"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <div style="margin-bottom: 12px; font-size: 13px;">
                    <b id="compareUserA" style="color: var(--primary);"></b>
                    <span style="color: var(--text-muted); margin: 0 8px;">vs</span>
                    <b id="compareUserB" style="color: var(--accent-purple);"></b>
                </div>
                <table class="compare-table">
                    <thead>
                        <tr>
                            <th>Group</th>
                            <th>User A</th>
                            <th>User B</th>
                        </tr>
                    </thead>
                    <tbody id="compareTable"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- New Task Modal -->
    <div class="modal-overlay" id="taskModal">
        <div class="modal-content" style="width: 520px;">
            <div class="modal-header">
                <h3><i class="fas fa-plus-circle" style="color: var(--accent-green); margin-right: 8px;"></i>New Call Task</h3>
                <button class="modal-close" onclick="closeModal('taskModal')"><i class="fas fa-times"></i></button>
            </div>
            <form id="newTaskForm">
                <div class="modal-body">
                    <div class="form-row">
                        <div class="form-group">
                            <label>EID</label>
                            <input type="text" name="eid" placeholder="Employee ID">
                        </div>
                        <div class="form-group">
                            <label>Name</label>
                            <input type="text" name="name" placeholder="Staff Name">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Department</label>
                            <input type="text" name="dept" placeholder="Department">
                        </div>
                        <div class="form-group">
                            <label>EXT</label>
                            <input type="text" name="ext" placeholder="Extension">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <textarea name="description" placeholder="Mô tả vấn đề..."></textarea>
                    </div>
                    <div class="form-group">
                        <label>Note</label>
                        <textarea name="note" placeholder="Ghi chú thêm..." style="min-height: 60px;"></textarea>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Priority</label>
                            <select name="priority">
                                <option value="High">High</option>
                                <option value="Medium" selected>Medium</option>
                                <option value="Low">Low</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Status</label>
                            <select name="status">
                                <option value="Todo" selected>Todo</option>
                                <option value="In Progress">In Progress</option>
                                <option value="Done">Done</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-ghost" onclick="closeModal('taskModal')">Cancel</button>
                    <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save Task</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
