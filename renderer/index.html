<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Helpdesk — Login</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="login-body">

    <!-- Custom Title Bar -->
    <div class="title-bar">
        <div class="title-bar-drag">
            <span class="title-bar-text"><i class="fas fa-shield-alt"></i> IT Helpdesk</span>
        </div>
        <div class="title-bar-controls">
            <button class="title-btn" id="btnMinimize"><i class="fas fa-minus"></i></button>
            <button class="title-btn close" id="btnClose"><i class="fas fa-times"></i></button>
        </div>
    </div>

    <!-- Login Container -->
    <div class="login-container">
        <!-- Animated Background -->
        <div class="login-bg">
            <div class="bg-orb orb-1"></div>
            <div class="bg-orb orb-2"></div>
            <div class="bg-orb orb-3"></div>
            <div class="grid-overlay"></div>
        </div>

        <!-- Login Card -->
        <div class="login-card" id="loginCard">
            <div class="login-logo">
                <div class="logo-icon">
                    <i class="fas fa-shield-alt"></i>
                </div>
                <h1>IT Helpdesk</h1>
                <p class="login-subtitle">Active Directory Management System</p>
            </div>

            <!-- Domain Info -->
            <div class="domain-badge">
                <i class="fas fa-network-wired"></i>
                <span id="domainInfo">Loading...</span>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="login-form">
                <div class="form-field">
                    <label for="username">
                        <i class="fas fa-user"></i> Windows Account
                    </label>
                    <input type="text" id="username" name="username" 
                           placeholder="Loading Windows Account..." 
                           readonly autocomplete="off">
                    <div class="field-hint">Tự động lấy từ Windows đang đăng nhập</div>
                </div>

                <div class="form-field">
                    <label for="password">
                        <i class="fas fa-lock"></i> Password
                    </label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" 
                               placeholder="Nhập mật khẩu AD của bạn" 
                               autocomplete="off" autofocus>
                        <button type="button" class="toggle-password" id="togglePassword">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div id="loginError" class="login-error" style="display: none;">
                    <i class="fas fa-exclamation-triangle"></i>
                    <span id="errorMessage">Sai mật khẩu hoặc tài khoản bị khóa.</span>
                </div>

                <button type="submit" class="login-btn" id="loginBtn">
                    <span class="btn-text">Đăng nhập</span>
                    <span class="btn-loading" style="display: none;">
                        <i class="fas fa-spinner fa-spin"></i> Đang xác thực...
                    </span>
                </button>
            </form>

            <!-- Footer Info -->
            <div class="login-footer">
                <div class="footer-item">
                    <i class="fas fa-building"></i>
                    <span>HTPVTG Corporation</span>
                </div>
                <div class="footer-item">
                    <i class="fas fa-server"></i>
                    <span>Domain: htpvtg.local</span>
                </div>
            </div>
        </div>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
