<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>IT Helpdesk Float</title>
    <!-- Use a simple CDN for FontAwesome to avoid missing node_modules path issues in floating if any -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: transparent;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            user-select: none;
        }
        .float-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .float-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.6);
        }
    </style>
</head>
<body>
    <div class="float-btn" id="floatBtn">
        <i class="fas fa-headset"></i>
    </div>
    <script src="js/floating.js"></script>
</body>
</html>
